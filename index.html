<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>bmail | Secure Inbox</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; margin: 0; display: flex; height: 100vh; }
        #sidebar { width: 260px; background: #ffffff; border-right: 1px solid #ddd; padding: 20px; display: flex; flex-direction: column; }
        #main { flex-grow: 1; padding: 40px; overflow-y: auto; }
        .email-card { background: white; padding: 20px; margin-bottom: 15px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border-left: 6px solid #007bff; }
        .user-badge { background: #e8f0fe; color: #1967d2; padding: 10px; border-radius: 8px; font-weight: bold; margin-bottom: 10px; }
        button.logout-btn { background: #ff4444; color: white; border: none; padding: 10px; border-radius: 5px; cursor: pointer; margin-top: auto; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div id="sidebar">
    <h1>bmail</h1>
    <div id="ez-sync-container">
        <iframe id="ez-frame" src="https://codeblub.github.io/Ez-login/sync.html?app=Bmail" 
                style="width: 100%; height: 400px; border: 1px solid #ddd; border-radius: 10px;"></iframe>
    </div>
    
    <div id="user-info" class="hidden"></div>
</div>

<div id="main">
    <header><h2 id="view-title">Please Sign in with Ez-login</h2></header>
    <div id="email-list"></div>
</div>

<script>
    let currentUserEmail = null;
    // Replace this with your actual Codespace Port 3000 URL!
    const API_URL = 'https://turbo-funicular-7v44pjw49j6xhrvwx-3000.app.github.dev';

    // 1. AUTO-LOGIN CHECK: Check if we already have a bmail address saved
    window.onload = () => {
        const saved = localStorage.getItem('bmail_session');
        if (saved) {
            const data = JSON.parse(saved);
            activateDashboard(data.email);
        }
    };

    // Listen for the message from sync.html
    window.addEventListener("message", (event) => {
        if (event.origin !== "https://codeblub.github.io") return;

        if (event.data.type === 'EZ_LOGIN_SUCCESS') {
            // 2. SAVE: Record the session so we don't ask again
            localStorage.setItem('bmail_session', JSON.stringify({
                user: event.data.user,
                email: event.data.email
            }));
            
            activateDashboard(event.data.email);
        }
    });

    function activateDashboard(email) {
        currentUserEmail = email;
        
        // UI Transitions
        document.getElementById('ez-sync-container').classList.add('hidden');
        document.getElementById('user-info').classList.remove('hidden');
        
        document.getElementById('user-info').innerHTML = `
            <div class="user-badge">${email}</div>
            <button class="logout-btn" onclick="logout()">Logout / Switch Account</button>
        `;
        
        document.getElementById('view-title').innerText = "Your Inbox";
        
        // Load the mail
        fetchEmails();
        // Check for new mail every 20 seconds
        setInterval(fetchEmails, 20000);
    }

    async function fetchEmails() {
        if (!currentUserEmail) return;
        try {
            const response = await fetch(`${API_URL}/inbox?user=${currentUserEmail}`);
            const emails = await response.json();
            const list = document.getElementById('email-list');
            
            if (emails.length === 0) {
                list.innerHTML = "<p>No messages in your inbox.</p>";
                return;
            }

            list.innerHTML = emails.map(e => `
                <div class="email-card">
                    <strong>From: ${e.from || 'Unknown'}</strong>
                    <p>${e.body}</p>
                </div>
            `).join('');
        } catch (e) { 
            console.log("Bmail Engine offline. Make sure server.js is running!"); 
        }
    }

    function logout() {
        // Clear both the Bmail session AND the dashboard link
        localStorage.removeItem('bmail_session');
        localStorage.removeItem('ez_login_bmail');
        location.reload();
    }
</script>
</body>
</html>
