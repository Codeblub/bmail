<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bmail | Secure Inbox</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; margin: 0; display: flex; height: 100vh; }
        #sidebar { width: 260px; background: #ffffff; border-right: 1px solid #ddd; padding: 20px; display: flex; flex-direction: column; }
        #main { flex-grow: 1; padding: 40px; overflow-y: auto; }
        .email-card { background: white; padding: 20px; margin-bottom: 15px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); transition: 0.3s; border-left: 6px solid #007bff; }
        .email-card:hover { transform: translateY(-2px); box-shadow: 0 6px 12px rgba(0,0,0,0.1); }
        h1 { color: #1a73e8; }
        #ez-sync-container { margin-bottom: 20px; text-align: center; }
        .user-badge { background: #e8f0fe; color: #1967d2; padding: 10px; border-radius: 8px; font-weight: bold; }
    </style>
</head>
<body>

<div id="sidebar">
    <h1>bmail</h1>
    <div id="ez-sync-container">
        <iframe 
            id="ez-frame"
            src="https://codeblub.github.io/Ez-login/sync.html?app=Bmail" 
            style="width: 100%; height: 400px; border: 1px solid #ddd; border-radius: 10px;">
        </iframe>
    </div>
    <div id="user-info"></div>
</div>

<div id="main">
    <header>
        <h2 id="view-title">Please Sign in with Ez-login</h2>
    </header>
    <div id="email-list">
        </div>
</div>

<script>
    let currentUser = null;
    // Replace this with your Codespace Port 3000 URL from the "Ports" tab!
    const API_URL = 'https://turbo-funicular-7v44pjw49j6xhrvwx-3000.app.github.dev'; 

    window.addEventListener("message", (event) => {
        if (event.origin !== "https://codeblub.github.io") return;

        if (event.data.type === 'EZ_LOGIN_SUCCESS') {
            currentUser = event.data.user;
            document.getElementById('ez-sync-container').style.display = 'none';
            document.getElementById('user-info').innerHTML = `<div class="user-badge">Logged in as: ${currentUser}@bmail.com</div>`;
            document.getElementById('view-title').innerText = "Your Inbox";
            
            fetchEmails(); // Get the first batch
            setInterval(fetchEmails, 25000); // Check every 25s
        }
    });

    async function fetchEmails() {
        if (!currentUser) return;
        try {
            const response = await fetch(`${API_URL}/inbox?user=${currentUser}`);
            const emails = await response.json();
            const list = document.getElementById('email-list');
            
            if (emails.length === 0) {
                list.innerHTML = "<p>No messages yet.</p>";
                return;
            }

            list.innerHTML = emails.map(e => `
                <div class="email-card">
                    <strong>From: ${e.from}</strong><br>
                    <small>${e.subject}</small>
                    <p>${e.body}</p>
                </div>
            `).join('');
        } catch (err) {
            console.error("Engine connection failed.");
        }
    }
</script>

</body>
</html>
